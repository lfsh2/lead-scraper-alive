<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f0" />
    <title>Sign in · Business Leads AI</title>
    <style>
      :root {
        --bg: #efece3;
        --card: #ffffff;
        --text: #1c1a17;
        --muted: #6b6459;
        --border: #e2ddd1;
        --accent: #b8892b;
        --accent-ink: #8a6a20;
        --btn: #1c1a17;
        --btn-text: #fbf9f4;
        --danger: #b04a3f;
        --danger-bg: #f6e6e3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0c0c;
          --card: #17150f;
          --text: #ece7dc;
          --muted: #9a9284;
          --border: #2a271f;
          --accent: #d4a94e;
          --accent-ink: #d4a94e;
          --btn: #d4a94e;
          --btn-text: #17150f;
          --danger: #e08b7f;
          --danger-bg: #2a1b18;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%; max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.25rem 2rem 2rem;
        box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.08);
      }
      .brand { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.75rem; }
      .brand .mark {
        width: 34px; height: 34px; border-radius: 9px;
        background: var(--btn); color: var(--btn-text);
        display: grid; place-items: center; flex: none;
      }
      .brand h1 {
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -0.01em;
      }
      .brand .v { font-size: 0.62rem; color: var(--muted); border: 1px solid var(--border); padding: 0.05rem 0.35rem; border-radius: 5px; margin-left: 0.1rem; }
      h2 { font-size: 1.05rem; margin: 0 0 0.35rem; letter-spacing: -0.01em; }
      p.sub { color: var(--muted); font-size: 0.88rem; margin: 0 0 1.5rem; }
      label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; letter-spacing: 0.02em; }
      input[type="password"] {
        width: 100%; padding: 0.7rem 0.85rem; font-size: 0.95rem;
        border: 1px solid var(--border); border-radius: 9px;
        background: var(--bg); color: var(--text); outline: none;
        transition: border-color .15s, box-shadow .15s;
      }
      input[type="password"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
      button {
        width: 100%; margin-top: 1.1rem; padding: 0.75rem 1rem;
        font-size: 0.95rem; font-weight: 600;
        background: var(--btn); color: var(--btn-text);
        border: none; border-radius: 9px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        transition: opacity .15s, transform .05s;
      }
      button:hover { opacity: 0.92; }
      button:active { transform: translateY(1px); }
      button[disabled] { opacity: 0.6; cursor: default; }
      .error {
        display: none; margin-top: 1rem; padding: 0.6rem 0.8rem;
        background: var(--danger-bg); color: var(--danger);
        border-radius: 8px; font-size: 0.85rem;
      }
      .error.show { display: block; }
      .foot { margin-top: 1.5rem; font-size: 0.75rem; color: var(--muted); text-align: center; }
      .spinner { width: 15px; height: 15px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <span class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" />
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
          </svg>
        </span>
        <h1>Business Leads AI</h1>
        <span class="v">v2.0</span>
      </div>

      <h2>Sign in</h2>
      <p class="sub">Enter your dashboard password to continue.</p>

      <form id="loginForm" autocomplete="off">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" autofocus required />
        <button type="submit" id="submitBtn">
          <span id="btnText">Sign in</span>
        </button>
        <div class="error" id="error"></div>
      </form>

      <div class="foot">Lead scraper &amp; outreach · authorized access only</div>
    </div>

    <script>
      var form = document.getElementById('loginForm');
      var errEl = document.getElementById('error');
      var btn = document.getElementById('submitBtn');
      var btnText = document.getElementById('btnText');

      function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.add('show');
      }
      function setLoading(on) {
        btn.disabled = on;
        btnText.innerHTML = on ? '<span class="spinner"></span>' : 'Sign in';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errEl.classList.remove('show');
        var pw = document.getElementById('password').value;
        if (!pw) return;
        setLoading(true);
        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (res.ok && res.d.ok) {
              window.location.href = '/';
            } else {
              setLoading(false);
              showError((res.d && res.d.error) || 'Incorrect password');
              document.getElementById('password').select();
            }
          })
          .catch(function () {
            setLoading(false);
            showError('Network error — try again');
          });
      });
    </script>
  </body>
</html>
